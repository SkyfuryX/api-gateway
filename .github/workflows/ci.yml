name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test-and-build:
    name: Tests & Compilation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Verify Go Module Integrity
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        env:
          DB_URL: "postgres://postgres:postgrespassword@localhost:5432/gateway_test?sslmode=disable"
          REDIS_ADDR: "localhost:6379"
        run: go test -v -cover ./...

      - name: Verify Binaries Compile
        run: |
          go build -v -o /dev/null ./cmd/gateway
          go build -v -o /dev/null ./cmd/mock_backend

  docker-integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Create mock .env file
        # Injects the environment variables required for the gateway to connect
        # using the default credentials from your docker-compose.yml
        run: |
          echo "DB_URL=postgres://postgres:postgres_password@gateway_postgres:5432/api_gateway?sslmode=disable" > .env
          echo "REDIS_ADDR=gateway_redis:6379" >> .env

      - name: Build and start Docker Compose network
        # The --wait flag blocks the CI runner until all container healthchecks 
        # (including your Go /healthz endpoint) report as "healthy"
        run: docker compose up -d --build --wait

      - name: Print Container Logs on Failure
        if: failure()
        run: docker compose logs