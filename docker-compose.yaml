services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_DB_NAME:-gateway_postgres}
    restart: always
    shm_size: 128mb
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-api_gateway}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_REDIS_NAME:-gateway_redis}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Gateway Application
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_APP_NAME:-api_gateway}
    ports:
      - "${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Probes your Go service's GET /healthz endpoint inside the container
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APP_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata: